services:
  - type: web
    name: nexushub-api
    runtime: node
    repo: https://github.com/ashutosh-dave/nexushub-erp
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: DB_SSL
        value: "true"
      - key: DB_PORT
        value: "18308"
      - key: DB_NAME
        value: defaultdb
      - key: DB_USER
        value: avnadmin
      - key: CORS_ORIGIN
        value: https://nexushub-erp.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PASSWORD
        sync: false
